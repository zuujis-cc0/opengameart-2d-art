<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="1024" height="512" shape-rendering="crispEdges">
  <!-- Deluxe Sci-Fi Outpost Props, Items & Pickups Sheet -->
  <defs>
    <style>
      .p-dark { fill: #0a0e1a; }
      .p-steel { fill: #2c3a54; }
      .p-red { fill: #ff3333; }
      .p-green { fill: #33ff66; }
      .p-cyan { fill: #00f0ff; }
      .p-gold { fill: #ffcc00; }
      .p-pink { fill: #ff007f; }
    </style>
  </defs>

  <g id="props">
    <!-- Explosive Hazard Barrel (32x32) -->
    <g transform="translate(0,0)">
      <rect x="6" y="4" width="20" height="24" class="p-red"/>
      <rect x="8" y="2" width="16" height="3" class="p-steel"/>
      <rect x="8" y="27" width="16" height="3" class="p-steel"/>
      <polygon points="16,8 10,18 22,18" class="p-gold"/>
      <text x="16" y="16" font-size="8" fill="#000" font-weight="bold" text-anchor="middle">!</text>
    </g>

    <!-- Toxic Hazard Barrel (32x32) -->
    <g transform="translate(32,0)">
      <rect x="6" y="4" width="20" height="24" class="p-green"/>
      <rect x="8" y="2" width="16" height="3" class="p-steel"/>
      <rect x="8" y="27" width="16" height="3" class="p-steel"/>
      <circle cx="16" cy="16" r="5" class="p-dark"/>
      <circle cx="16" cy="16" r="2" class="p-green"/>
    </g>

    <!-- Health Medkit (32x32) -->
    <g transform="translate(64,0)">
      <rect x="4" y="8" width="24" height="18" class="p-steel"/>
      <rect x="6" y="10" width="20" height="14" fill="#ffffff"/>
      <rect x="14" y="12" width="4" height="10" class="p-red"/>
      <rect x="11" y="15" width="10" height="4" class="p-red"/>
    </g>

    <!-- Plasma Energy Cell (32x32) -->
    <g transform="translate(96,0)">
      <rect x="8" y="6" width="16" height="20" class="p-steel"/>
      <rect x="11" y="8" width="10" height="16" class="p-cyan"/>
      <line x1="16" y1="8" x2="16" y2="24" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Keycard Terminal (32x32) -->
    <g transform="translate(128,0)">
      <rect x="8" y="4" width="16" height="24" class="p-steel"/>
      <rect x="11" y="7" width="10" height="8" class="p-gold"/>
      <rect x="11" y="18" width="10" height="2" class="p-dark"/>
    </g>
  </g>
</svg>