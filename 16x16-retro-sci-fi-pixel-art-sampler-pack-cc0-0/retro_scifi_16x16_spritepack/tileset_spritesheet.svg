<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="1024" height="512" shape-rendering="crispEdges">
  <!-- Deluxe 16x16 & 32x32 Sci-Fi Outpost Modular Tileset (Clean Transparent Background) -->
  <defs>
    <style>
      .t-dark { fill: #0a0e1a; }
      .t-steel-d { fill: #182236; }
      .t-steel-m { fill: #2c3a54; }
      .t-steel-l { fill: #485c80; }
      .t-steel-hi { fill: #7890b8; }
      .t-hazard { fill: #ffcc00; }
      .t-cyan-l { fill: #00f0ff; }
      .t-pink-l { fill: #ff007f; }
      .t-red-l { fill: #ff3333; }
      .t-pipe { fill: #0099cc; }
      .t-wire { fill: #cc0066; }
    </style>
  </defs>

  <g id="tileset">
    <!-- Tile 1: Tech Floor Plate (32x32) -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="32" height="32" class="t-steel-d"/>
      <rect x="1" y="1" width="30" height="30" class="t-steel-m"/>
      <rect x="3" y="3" width="26" height="26" class="t-steel-d"/>
      <circle cx="5" cy="5" r="1" class="t-steel-hi"/>
      <circle cx="27" cy="5" r="1" class="t-steel-hi"/>
      <circle cx="5" cy="27" r="1" class="t-steel-hi"/>
      <circle cx="27" cy="27" r="1" class="t-steel-hi"/>
      <line x1="16" y1="3" x2="16" y2="29" stroke="#182236" stroke-width="2"/>
      <line x1="3" y1="16" x2="29" y2="16" stroke="#182236" stroke-width="2"/>
    </g>

    <!-- Tile 2: Hazard Caution Stripe Floor (32x32) -->
    <g transform="translate(32,0)">
      <rect x="0" y="0" width="32" height="32" class="t-dark"/>
      <polygon points="0,0 8,0 0,8" class="t-hazard"/>
      <polygon points="16,0 24,0 0,24 0,16" class="t-hazard"/>
      <polygon points="32,0 32,8 8,32 0,32" class="t-hazard"/>
      <polygon points="32,16 32,24 24,32 16,32" class="t-hazard"/>
      <rect x="0" y="0" width="32" height="32" fill="none" stroke="#2c3a54" stroke-width="2"/>
    </g>

    <!-- Tile 3: Metallic Floor Grate with Sub-level Glow (32x32) -->
    <g transform="translate(64,0)">
      <rect x="0" y="0" width="32" height="32" class="t-dark"/>
      <!-- Glowing Cables Below -->
      <line x1="0" y1="10" x2="32" y2="10" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
      <line x1="0" y1="22" x2="32" y2="22" stroke="#ff007f" stroke-width="3" opacity="0.6"/>
      <!-- Grate Ribs -->
      <line x1="4" y1="0" x2="4" y2="32" stroke="#485c80" stroke-width="2"/>
      <line x1="12" y1="0" x2="12" y2="32" stroke="#485c80" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="32" stroke="#485c80" stroke-width="2"/>
      <line x1="28" y1="0" x2="28" y2="32" stroke="#485c80" stroke-width="2"/>
    </g>

    <!-- Tile 4: Wall Bulkhead Column (32x32) -->
    <g transform="translate(96,0)">
      <rect x="0" y="0" width="32" height="32" class="t-steel-d"/>
      <rect x="4" y="0" width="24" height="32" class="t-steel-m"/>
      <rect x="8" y="0" width="16" height="32" class="t-steel-l"/>
      <rect x="14" y="4" width="4" height="24" class="t-cyan-l"/>
    </g>

    <!-- Tile 5: Interactive Computer Terminal (32x32) -->
    <g transform="translate(128,0)">
      <rect x="4" y="8" width="24" height="24" class="t-steel-d"/>
      <rect x="6" y="10" width="20" height="14" class="t-steel-m"/>
      <!-- Glowing Screen -->
      <rect x="8" y="12" width="16" height="10" class="t-dark"/>
      <rect x="10" y="14" width="12" height="6" class="t-cyan-l"/>
      <line x1="11" y1="16" x2="18" y2="16" stroke="#ffffff" stroke-width="1"/>
      <line x1="11" y1="18" x2="15" y2="18" stroke="#ffffff" stroke-width="1"/>
      <!-- Keyboard -->
      <rect x="6" y="26" width="20" height="4" class="t-steel-l"/>
    </g>

    <!-- Tile 6: Glowing Energy Reactor Core (32x32) -->
    <g transform="translate(160,0)">
      <rect x="2" y="2" width="28" height="28" class="t-steel-d"/>
      <circle cx="16" cy="16" r="11" class="t-steel-m"/>
      <circle cx="16" cy="16" r="8" class="t-cyan-l"/>
      <circle cx="16" cy="16" r="5" class="t-pink-l"/>
      <circle cx="16" cy="16" r="2" stroke="#ffffff" stroke-width="1" fill="#ffffff"/>
    </g>
  </g>
</svg>