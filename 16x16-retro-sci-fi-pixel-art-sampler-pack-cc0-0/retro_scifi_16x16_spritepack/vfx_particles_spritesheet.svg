<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="1024" height="512" shape-rendering="crispEdges">
  <!-- Deluxe Sci-Fi Particle VFX & Impact Effects Sheet -->
  <defs>
    <style>
      .v-cyan { fill: #00f0ff; }
      .v-pink { fill: #ff007f; }
      .v-gold { fill: #ffcc00; }
      .v-white { fill: #ffffff; }
      .v-red { fill: #ff3333; }
    </style>
  </defs>

  <g id="vfx">
    <!-- Plasma Muzzle Bloom (32x32) -->
    <g transform="translate(0,0)">
      <circle cx="16" cy="16" r="14" class="v-cyan" opacity="0.6"/>
      <circle cx="16" cy="16" r="10" class="v-cyan"/>
      <circle cx="16" cy="16" r="6" class="v-white"/>
      <polygon points="16,0 18,12 30,16 18,20 16,32 14,20 2,16 14,12" class="v-cyan"/>
    </g>

    <!-- Shield Deflection Wave (32x32) -->
    <g transform="translate(32,0)">
      <path d="M 6,4 A 14,14 0 0,1 6,28 L 10,26 A 10,10 0 0,0 10,6 Z" class="v-pink"/>
      <path d="M 12,8 A 8,8 0 0,1 12,24 L 14,22 A 6,6 0 0,0 14,10 Z" class="v-white"/>
    </g>

    <!-- Explosion Burst (32x32) -->
    <g transform="translate(64,0)">
      <polygon points="16,2 20,10 30,6 24,16 32,22 20,24 18,32 12,24 2,26 8,16 0,10 12,12" class="v-gold"/>
      <polygon points="16,6 18,12 24,10 20,16 26,20 18,20 16,26 14,20 6,20 12,16 8,10 14,12" class="v-red"/>
      <circle cx="16" cy="16" r="4" class="v-white"/>
    </g>

    <!-- Laser Target Strike (32x32) -->
    <g transform="translate(96,0)">
      <line x1="0" y1="16" x2="32" y2="16" stroke="#ff3333" stroke-width="4"/>
      <line x1="0" y1="16" x2="32" y2="16" stroke="#ffffff" stroke-width="2"/>
      <circle cx="16" cy="16" r="6" class="v-red"/>
      <circle cx="16" cy="16" r="3" class="v-white"/>
    </g>
  </g>
</svg>